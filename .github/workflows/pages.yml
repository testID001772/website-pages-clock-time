# Publish the static build to GitHub Pages.
#
# Pages serves files only, so this workflow runs `npm run build:pages`
# (prerendered HTML, `base` set to the project path, no server) and hands the
# result to `actions/deploy-pages`. That is the whole deployment: the database,
# Better Auth and the music library stay in the app's server build, which this
# site does not use — the static build swaps the playlist for the shipped
# `music/library.json` and hides the account UI.
#
# The repository must have Pages set to "GitHub Actions" as its source
# (Settings → Pages → Build and deployment). `scripts/build-pages.mjs` fails the
# job if the output could not work on a static host.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - arena/8c7bed09-website-pages-clock-time
      - main
  # Manual runs without a commit (e.g. after changing Pages settings).
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the static site
        # A GitHub project site is served from `/<repo>/`; the build mounts the
        # app and its assets there (a trailing hyphen in the repo name is part
        # of the path, hence the slashes around the expression).
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
